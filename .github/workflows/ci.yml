# .github/workflows/ci.yml
#
# Riscos:
# 1. Lentidão ou falha de rede ao puxar imagens de terceiros (como gitleaks/trivy) nos runners compartilhados do GitHub.
# 2. Falsos negativos se a configuração de ignore no CI (.gitleaksignore) mascarar falhas ativas de vazamento de segredos reais.
# 3. Exaustão de espaço em disco no runner do GitHub Actions devido ao acúmulo de camadas Docker intermediárias durante o build.
#
# Ambiguidades:
# 1. Se o workflow deve rodar de forma concorrente em pushes consecutivos ou cancelar a execução anterior (concurrency rules).
# 2. Se devemos rodar os linters de formatação em toda a base ou focar apenas nas modificações trazidas pelo Pull Request.

name: Northwind Traders CI

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main", "feature/*" ]

jobs:
  static-analysis:
    name: Análise Estática (SAST, SCA & Secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências Estáticas
        run: |
          python -m pip install --upgrade pip
          pip install bandit black flake8

      - name: Executar Code Formatter Check (Black)
        run: black --check app/

      - name: Executar Linter (Flake8)
        run: flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Executar Bandit (SAST)
        run: bandit -r app/

      - name: Executar Gitleaks (Secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration-tests:
    name: Testes de Integração Dinâmicos (Docker & Pipeline)
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Executar Pipeline de Integração Ponta a Ponta
        run: ./bin/ci-integration-test.sh
